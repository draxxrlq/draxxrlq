<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#123047" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#vignette)"/>
  <rect width="1200" height="600" fill="url(#dots)"/>

  <g stroke="#123047" stroke-width="1" opacity="0.5" fill="none">
    <path d="M0,120 H300 V220 H600 V80 H900 V300 H1200"/>
    <path d="M0,480 H250 V400 H550 V520 H850 V420 H1200"/>
  </g>

  <g fill="#00e5ff">
    <circle cx="300" cy="220" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="80" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="300" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#8b5cf6">
    <circle cx="550" cy="520" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="420" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating particles -->
  <g fill="#5ee7ff" opacity="0.6">
    <circle cx="150" cy="500" r="2">
      <animate attributeName="cy" values="500;460;500" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="140" r="2">
      <animate attributeName="cy" values="140;180;140" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="550" r="2">
      <animate attributeName="cy" values="550;500;550" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
