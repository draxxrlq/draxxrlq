<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#2f6bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="coreBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <circle cx="180" cy="180" r="170" fill="#05070d"/>

  <circle cx="180" cy="180" r="140" fill="url(#coreGlow)">
    <animate attributeName="r" values="120;150;120" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.6">
    <circle cx="180" cy="180" r="95">
      <animateTransform attributeName="transform" type="rotate" from="0 180 180" to="360 180 180" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="180" r="110" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="360 180 180" to="0 180 180" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.7">
    <polygon points="180,110 240,145 240,215 180,250 120,215 120,145"/>
  </g>

  <circle cx="180" cy="180" r="45" fill="#0c1730" stroke="#00e5ff" stroke-width="2" filter="url(#coreBlur)">
    <animate attributeName="r" values="40;48;40" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="20" fill="#00e5ff">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <text x="180" y="330" font-family="'Consolas','Courier New',monospace" font-size="13" fill="#5ee7ff" text-anchor="middle" letter-spacing="2">CORE.STATUS :: STABLE</text>
</svg>
